.row .n{text-align:right;font-weight:600}.row.off{color:var(--mut);cursor:default}.row.off:hover{background:none}
.hint{color:var(--mut);font-size:15px;margin:12px 4px}
.btns{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-top:18px}

button:hover{border-color:#2b79d6}
#msg{color:var(--mut);font-size:15px}
#tip{position:fixed;pointer-events:none;background:var(--tip);color:var(--tipfg);padding:8px 11px;border-radius:8px;font-size:14px;line-height:1.35;opacity:0;transition:opacity .1s;z-index:9;max-width:220px}
